<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Agri Connect</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body{
            font-family: Arial;
            background:#eef7f1;
        }
        .container{
            width:350px;
            margin:60px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 12px rgba(0,0,0,0.1);
            text-align:center;
        }
        input, select{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }
        button{
            width:100%;
            padding:10px;
            background:#2e8b57;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover{
            background:#246b45;
        }
        #message{
            margin-top:10px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Register</h2>

    <form id="registerForm">

        <input type="text" id="name" placeholder="Name" required>

        <input type="email" id="email" placeholder="Email" required>

        <input type="password" id="password" placeholder="Password" required>

        <!-- ✅ UPDATED ROLE -->
        <select id="role">
    <option value="farmer">Farmer</option>
    <option value="customer">Customer</option>
    <option value="driver">Driver</option>
    <option value="officer">Agri Officer</option> <!-- ADD THIS -->
</select>

        <input type="text" id="phone" placeholder="Phone" required>

        <input type="text" id="district" placeholder="District" required>

        <button type="submit">Register</button>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="login.html">Login here</a>
    </p>

    <p id="message"></p>

</div>

<script>

const form = document.getElementById('registerForm');
const message = document.getElementById('message');

form.addEventListener('submit', async (e) => {

    e.preventDefault();

    const data = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value.trim(),
        role: document.getElementById('role').value,
        phone: document.getElementById('phone').value.trim(),
        district: document.getElementById('district').value.trim()
    };

    // ✅ Simple validation
    if(!data.role){
        message.style.color = "red";
        message.textContent = "Please select a role!";
        return;
    }

    try {

        const res = await fetch('http://localhost:3000/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        message.style.color = "green";
        message.textContent = result.message;

        form.reset();

    } catch (err) {

        message.style.color = "red";
        message.textContent = 'Error: Could not register!';
        console.log(err);
    }
});

</script>

</body>
</html>
