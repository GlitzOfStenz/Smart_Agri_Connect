<!DOCTYPE html>
<html>
<head>
<title>District Heatmap</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background:#eef7f1;
    text-align:center;
}

canvas{
    max-width:700px;
    margin:auto;
}
</style>
</head>

<body>

<h2>📍 District Demand Heatmap</h2>

<canvas id="chart"></canvas>

<script>

fetch("http://localhost:3000/districtHeatmap")
.then(res=>res.json())
.then(data=>{

    let labels = data.map(d => d.district);
    let values = data.map(d => d.total_orders);

    new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Orders",
                data: values,
                backgroundColor: [
                    "#a5d6a7","#81c784","#66bb6a","#4caf50","#388e3c"
                ]
            }]
        }
    });

});

</script>

</body>
</html>
